[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-drone"
version = "0.1.0"
description = "Simulated surface water drone publishing keelson-compatible telemetry via zenoh"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",
    "aiofiles>=23.0",
    "eclipse-zenoh==1.7.2",
    "protobuf>=5.29.1",
    "pyyaml>=6.0",
    "parse>=1.19",
    # keelson alpha SDK — pinned to a specific commit SHA (see [tool.uv.sources])
    "keelson>=0.5.0a9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # httpx is required by starlette.testclient (used in e2e tests)
    "httpx>=0.27",
    # protoc-wheel-0 provides the `protoc` binary used by scripts/generate_keelson_protos.sh
    # Run that script after `uv sync --all-extras` to compile the keelson protobuf stubs.
    "protoc-wheel-0>=30.2",
    "grpcio-tools>=1.60",
]

[project.scripts]
ghost-drone = "ghost_drone.__main__:main"

[tool.uv.sources]
# keelson is an alpha SDK on the dev branch — pinned to commit SHA e47e52fd
# to prevent unexpected API changes from breaking the build.
# To update: run `git ls-remote https://github.com/RISE-Maritime/keelson.git dev`
# and update the rev field with the new SHA.
keelson = { git = "https://github.com/RISE-Maritime/keelson.git", subdirectory = "sdks/python", rev = "e47e52fd1d8eb77cec4792e431b00e0549070bfa" }
