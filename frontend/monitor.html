<!DOCTYPE html>
<html lang="en" data-obc-theme="dusk" class="obc-component-size-regular">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ghost-drone monitor</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@oicl/openbridge-webcomponents@0.0.17/src/palettes/variables.css">

  <style>
    @font-face {
      font-family: 'Noto Sans';
      src: url('https://cdn.jsdelivr.net/npm/@oicl/openbridge-webcomponents@0.0.17/dist/NotoSans.ttf')
           format('truetype');
    }

    :root,
    [data-obc-theme="dusk"] {
      --container-overlay-color:          rgba(0, 0, 0, 0.72);
      --instrument-enhanced-primary-color: rgb(90, 132, 191);
      --instrument-enhanced-glow:         rgba(90, 132, 191, 0.12);
      --instrument-port-primary-color:    rgb(165, 90, 106);
      --instrument-starboard-primary-color: rgb(0, 128, 95);
      --sidebar-bg:                       rgba(0, 0, 0, 0.18);
    }

    [data-obc-theme="night"] {
      --container-overlay-color:          rgba(0, 0, 0, 0.90);
      --instrument-enhanced-primary-color: rgb(200, 148, 0);
      --instrument-enhanced-glow:         rgba(200, 148, 0, 0.10);
      --instrument-port-primary-color:    rgb(120, 40, 52);
      --instrument-starboard-primary-color: rgb(0, 82, 58);
      --sidebar-bg:                       rgba(0, 0, 0, 0.25);
    }

    [data-obc-theme="day"] {
      --container-overlay-color:          rgba(80, 80, 90, 0.50);
      --instrument-enhanced-primary-color: rgb(0, 56, 158);
      --instrument-enhanced-glow:         rgba(0, 56, 158, 0.08);
      --instrument-port-primary-color:    rgb(165, 90, 106);
      --instrument-starboard-primary-color: rgb(0, 128, 95);
      --sidebar-bg:                       rgba(0, 0, 0, 0.03);
    }

    [data-obc-theme="bright"] {
      --container-overlay-color:          rgba(60, 62, 70, 0.45);
      --instrument-enhanced-primary-color: rgb(0, 46, 148);
      --instrument-enhanced-glow:         rgba(0, 46, 148, 0.06);
      --instrument-port-primary-color:    rgb(165, 90, 106);
      --instrument-starboard-primary-color: rgb(0, 128, 95);
      --sidebar-bg:                       rgba(0, 0, 0, 0.02);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: 'Noto Sans', sans-serif;
      font-size: 13px;
      background-color: var(--container-backdrop-color);
      color: var(--element-active-color);
    }

    #app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ---- Top bar ---- */
    #top-bar {
      height: 48px;
      background: var(--container-global-color);
      border-bottom: 1px solid var(--border-outline-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 200;
    }

    #app-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--element-active-color);
      letter-spacing: 0.04em;
      user-select: none;
      text-transform: uppercase;
    }

    #app-subtitle {
      font-size: 10px;
      color: var(--element-inactive-color);
      letter-spacing: 0.05em;
      user-select: none;
      text-transform: uppercase;
    }

    #top-bar-spacer { flex: 1; }

    #connection-status {
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 2px 10px;
      border-radius: 3px;
      font-weight: 600;
    }
    #connection-status.connected {
      color: var(--instrument-starboard-primary-color);
      border: 1px solid var(--instrument-starboard-primary-color);
    }
    #connection-status.disconnected {
      color: var(--instrument-port-primary-color);
      border: 1px solid var(--instrument-port-primary-color);
    }

    #theme-select {
      background: var(--container-global-color);
      color: var(--element-active-color);
      border: 1px solid var(--border-outline-color);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 11px;
    }

    /* ---- Main content ---- */
    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #main-content::-webkit-scrollbar { width: 6px; }
    #main-content::-webkit-scrollbar-track { background: transparent; }
    #main-content::-webkit-scrollbar-thumb {
      background: var(--border-outline-color);
      border-radius: 3px;
    }

    /* ---- Drone tabs ---- */
    #drone-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .drone-tab {
      padding: 6px 14px;
      border: 1px solid var(--border-outline-color);
      border-radius: 4px 4px 0 0;
      background: var(--container-global-color);
      color: var(--element-inactive-color);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: background 0.15s, color 0.15s;
    }
    .drone-tab:hover {
      color: var(--element-active-color);
    }
    .drone-tab.active {
      background: var(--container-overlay-color);
      color: var(--element-active-color);
      border-bottom-color: transparent;
    }

    #no-drones-msg {
      color: var(--element-inactive-color);
      font-style: italic;
      padding: 32px 0;
      text-align: center;
    }

    /* ---- Cards ---- */
    .card {
      background: var(--container-global-color);
      border: 1px solid var(--border-outline-color);
      border-radius: 6px;
      padding: 16px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--element-inactive-color);
      margin-bottom: 12px;
    }

    /* ---- Health card ---- */
    .health-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .health-badge.nominal  { color: #0b0; border: 1px solid #0b0; }
    .health-badge.degraded { color: #da0; border: 1px solid #da0; }
    .health-badge.critical { color: #d33; border: 1px solid #d33; }
    .health-badge.inactive { color: var(--element-inactive-color); border: 1px solid var(--border-outline-color); }
    .health-badge.unknown  { color: var(--element-inactive-color); border: 1px solid var(--border-outline-color); }

    .health-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .health-label {
      font-size: 12px;
      font-weight: 600;
      min-width: 100px;
      color: var(--element-neutral-color);
    }

    .health-detail {
      font-size: 11px;
      color: var(--element-inactive-color);
      font-style: italic;
    }

    /* ---- Rate table ---- */
    .rate-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    .rate-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--element-inactive-color);
      padding: 6px 12px;
      border-bottom: 1px solid var(--border-outline-color);
    }

    .rate-table td {
      padding: 8px 12px;
      font-size: 12px;
      border-bottom: 1px solid var(--border-outline-color);
    }

    .rate-table tr:last-child td {
      border-bottom: none;
    }

    .rate-cell {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .keyexpr-cell {
      font-family: monospace;
      font-size: 10px;
      color: var(--element-inactive-color);
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rate-ok     { color: #0b0; }
    .rate-warn   { color: #da0; }
    .rate-bad    { color: #d33; }
    .rate-none   { color: var(--element-inactive-color); }

    .deviation-cell {
      font-size: 11px;
    }
    .deviation-ok   { color: var(--element-inactive-color); }
    .deviation-warn { color: #da0; }
    .deviation-bad  { color: #d33; }

    /* ---- Rate bar ---- */
    .rate-bar-container {
      width: 100px;
      height: 8px;
      background: var(--container-overlay-color);
      border-radius: 4px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
    }
    .rate-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* ---- Health log ---- */
    #health-log {
      max-height: 300px;
      overflow-y: auto;
      font-size: 11px;
      font-family: 'Noto Sans', monospace;
    }
    #health-log::-webkit-scrollbar { width: 4px; }
    #health-log::-webkit-scrollbar-track { background: transparent; }
    #health-log::-webkit-scrollbar-thumb {
      background: var(--border-outline-color);
      border-radius: 2px;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid var(--border-outline-color);
      display: flex;
      gap: 12px;
    }
    .log-entry:last-child { border-bottom: none; }

    .log-time {
      color: var(--element-inactive-color);
      min-width: 80px;
      flex-shrink: 0;
    }

    .log-level {
      font-weight: 700;
      min-width: 70px;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .log-msg {
      color: var(--element-neutral-color);
    }

    /* ---- Faults summary ---- */
    .fault-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin: 2px;
      background: rgba(211, 51, 51, 0.15);
      color: #d33;
      border: 1px solid rgba(211, 51, 51, 0.3);
    }

    .no-faults {
      color: var(--element-inactive-color);
      font-size: 11px;
      font-style: italic;
    }

    .cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .cards-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app-wrapper">
    <div id="top-bar">
      <div id="app-identity">
        <span id="app-title">ghost-drone</span>
        <span id="app-subtitle">monitor</span>
      </div>
      <span id="top-bar-spacer"></span>
      <span id="connection-status" class="disconnected">DISCONNECTED</span>
      <select id="theme-select">
        <option value="dusk" selected>Dusk</option>
        <option value="night">Night</option>
        <option value="day">Day</option>
        <option value="bright">Bright</option>
      </select>
    </div>

    <div id="main-content">
      <div id="drone-tabs"></div>
      <div id="no-drones-msg">Waiting for drones...</div>

      <div id="drone-panel" style="display:none;">
        <div class="cards-row">
          <!-- Health card -->
          <div class="card">
            <div class="card-title">Health Status</div>
            <div id="health-overview">
              <div class="health-row">
                <span class="health-label">Overall</span>
                <span id="health-overall" class="health-badge unknown">--</span>
              </div>
              <div class="health-row">
                <span class="health-label">Mode</span>
                <span id="health-mode" style="font-size:12px;font-weight:600;">--</span>
              </div>
              <div class="health-row">
                <span class="health-label">Health Rate</span>
                <span id="health-rate-hz" style="font-size:12px;font-weight:600;">--</span>
              </div>
              <div id="subsystems-container"></div>
            </div>
          </div>

          <!-- Faults inferred from health subsystem details -->
          <div class="card">
            <div class="card-title">Faults (from health message)</div>
            <div id="faults-container">
              <span class="no-faults">No health data yet</span>
            </div>
          </div>
        </div>

        <!-- Rate comparison table -->
        <div class="card">
          <div class="card-title">Telemetry Rate Comparison</div>
          <table class="rate-table">
            <thead>
              <tr>
                <th>Subject</th>
                <th>Key Expression</th>
                <th>Expected (Hz)</th>
                <th>Actual (Hz)</th>
                <th>Deviation</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rate-table-body"></tbody>
          </table>
        </div>

        <!-- Health log -->
        <div class="card">
          <div class="card-title">Health Message Log</div>
          <div id="health-log"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/monitor.ts"></script>
</body>
</html>
